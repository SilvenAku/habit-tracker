<script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg.dragging .twk-seg-thumb{transition:none}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:pointer;padding:4px 6px;line-height:1.2}
  .twk-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:2147483646;
    width:36px;height:36px;border-radius:18px;border:.5px solid rgba(255,255,255,.15);
    background:rgba(40,38,55,.55);color:rgba(232,225,209,.7);font-size:14px;cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(() => {
    try {
      const raw = localStorage.getItem('habit-tracker-tweaks');
      return raw ? { ...defaults, ...JSON.parse(raw) } : defaults;
    } catch { return defaults; }
  });
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => {
      const next = { ...prev, ...edits };
      try { localStorage.setItem('habit-tracker-tweaks', JSON.stringify(next)); } catch {}
      return next;
    });
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  // PWA: default closed. Tap the floating ⚙︎ in the corner to open.
  const [open, setOpen] = React.useState(false);
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      {open ? (
        <div className="twk-panel">
          <div className="twk-hd">
            <b>{title}</b>
            <button className="twk-x" aria-label="Close tweaks" onClick={() => setOpen(false)}>✕</button>
          </div>
          <div className="twk-body">{children}</div>
        </div>
      ) : (
        <button className="twk-fab" aria-label="Open tweaks" onClick={() => setOpen(true)}>⚙︎</button>
      )}
    </>
  );
}

function TweakSection({ title, children }) {
  return (
    <>
      <div className="twk-sect">{title}</div>
      {children}
    </>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <div className="twk-row">
      {label && <div className="twk-lbl"><span>{label}</span></div>}
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRadio });
</script>

<script type="text/babel">
const _now = new Date();
const TODAY = new Date(_now.getFullYear(), _now.getMonth(), _now.getDate());

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) {
  const r = new Date(d); r.setDate(r.getDate()+n); return r;
}
function startOfWeek(d) {
  const r = new Date(d);
  const day = (r.getDay() + 6) % 7;
  r.setDate(r.getDate() - day);
  return r;
}

const HABITS = [];

function isLogged(habit, d) { return habit.logs.has(dateKey(d)); }

// Calories: Health categories add to net intake (positive), Fitness subtracts (negative).
// User always types positive numbers; sign is implied by category.
function isCalorieHabit(h) { return h.category === 'Health' || h.category === 'Fitness'; }
function caloriesForDate(habit, d) {
  if (!isCalorieHabit(habit)) return 0;
  const v = habit.calories?.[dateKey(d)];
  if (typeof v !== 'number') return 0;
  return habit.category === 'Health' ? v : -v;
}
function netCaloriesForDates(habits, dates) {
  let net = 0;
  for (const h of habits) {
    if (!isCalorieHabit(h)) continue;
    for (const d of dates) net += caloriesForDate(h, d);
  }
  return net;
}

const STORAGE_KEY = 'habit-tracker-v1';
function loadPersisted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    return {
      habits: (p.habits || []).map(h => ({
        ...h,
        logs: new Set(h.logs || []),
        calories: h.calories || {},
      })),
      categories: p.categories || null,
    };
  } catch { return null; }
}
function savePersisted(habits, categories) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      habits: habits.map(h => ({ ...h, logs: Array.from(h.logs || []), calories: h.calories || {} })),
      categories,
    }));
  } catch {}
}

Object.assign(window, {
  TODAY, HABITS, dateKey, addDays, startOfWeek, isLogged,
  isCalorieHabit, caloriesForDate, netCaloriesForDates,
  loadPersisted, savePersisted,
});
</script>

              }}>Today</button>
            )}
            <button onClick={() => setCurrentDate(addDays(weekStart, -1))} style={navBtn(p)}>‹</button>
            <button onClick={() => setCurrentDate(addDays(weekStart, 7))} style={navBtn(p)}>›</button>
          </div>
        }
      />

      {caloriesGoal > 0 && habits.some(isCalorieHabit) && (
        <CalorieIndicator palette={p} label={`Week ${weekNum} calories`}
          net={netCaloriesForDates(habits, days)}
          goal={caloriesGoal} days={7}/>
      )}

      <OrnateDivider color={p.gold} style={{ padding: '0 24px', margin: '12px 0 16px' }}/>

      <div style={{ padding: '0 18px', display: 'flex', gap: 6, marginBottom: 8 }}>
        <div style={{ width: 64 }}/>
        {days.map((d, i) => {
          const today = dateKey(d) === dateKey(TODAY);
          return (
            <div key={i} style={{ width: cellSize, textAlign: 'center' }}>
              <div style={{
                fontFamily: 'Inter', fontSize: 10, letterSpacing: 1,
                color: today ? p.accent : p.pearlDim, textTransform: 'uppercase',
                fontWeight: 600,
              }}>{dayLetters[i]}</div>
              <div style={{
                fontFamily: 'JetBrains Mono', fontSize: 12,
                color: today ? p.accent : p.gold, marginTop: 2,
                fontWeight: today ? 700 : 400,
              }}>{d.getDate()}</div>
            </div>
          );
        })}
      </div>

      <div style={{ padding: '0 18px' }}>
        {habits.map((h, hi) => {
          const completedCount = days.filter(d => isLogged(h, d)).length;
          const rate = completedCount / 7;
          return (
            <div key={h.id} style={{
              padding: '8px 0',
              borderTop: hi > 0 ? `1px solid ${p.gold}1A` : 'none',
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <div onClick={() => onOpenHabit(h)} style={{ width: 64, cursor: 'pointer' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                    <HabitGlyph name={h.glyph} size={11} color={p.goldDim}/>
                    <div style={{
                      fontFamily: '"Cormorant Garamond", serif', fontSize: 14,
                      color: p.pearl, lineHeight: 1.1, fontWeight: 500,
                    }}>{h.name.split(' ').slice(0,2).join(' ')}</div>
                  </div>
                  <div style={{
                    fontFamily: 'JetBrains Mono', fontSize: 9, color: p.goldDim,
                    marginTop: 3, letterSpacing: 0.5,
                  }}>{completedCount}/7</div>
                </div>
                {days.map((d, di) => {
                  const checked = isLogged(h, d);
                  const isFuture = d > TODAY;
                  const today = dateKey(d) === dateKey(TODAY);
                  return (
                    <HabitCell
                      key={di}
                      checked={checked}
                      style={checkboxStyle}
                      palette={p}
                      size={cellSize}
                      isToday={today}
                      dim={isFuture}
                      onClick={() => !isFuture && toggleLog(h.id, d)}
                    />
                  );
                })}
              </div>
              <div style={{
                height: 1, background: `${p.gold}15`, marginLeft: 70, marginTop: 4,
                position: 'relative',
              }}>
                <div style={{
                  position: 'absolute', left: 0, top: -0.5, height: 2,
                  width: `${rate * 100}%`,
                  background: rate === 1 ? p.goldGlow : p.gold,
                  opacity: 0.7,
                }}/>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MonthView({ palette, checkboxStyle, habits, toggleLog, caloriesGoal = 0, categories = [], currentDate, setCurrentDate, onOpenHabit }) {
  const p = palette;
  const [filterCategory, setFilterCategory] = useState("__all");
  useEffect(() => {
    if (filterCategory !== "__all" && !categories.includes(filterCategory)) {
      setFilterCategory("__all");
    }
  }, [categories, filterCategory]);

  const visibleHabits = filterCategory === "__all"
    ? habits
    : habits.filter(h => h.category === filterCategory);

  const isAnyLogged = (d) => visibleHabits.some(h => isLogged(h, d));
  const groupLabel = filterCategory === "__all" ? "All habits" : filterCategory;

  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
  while (cells.length % 7 !== 0) cells.push(null);

  const completed = cells.filter(d => d && isAnyLogged(d)).length;
  const totalSoFar = cells.filter(d => d && d <= TODAY && d.getMonth() === month).length;
  const pct = totalSoFar > 0 ? Math.round(completed / totalSoFar * 100) : 0;

  const longestStreak = (() => {
    let best = 0, cur = 0;
    for (const d of cells) {
      if (!d) continue;
      if (isAnyLogged(d)) { cur++; best = Math.max(best, cur); }
      else cur = 0;
    }
    return best;
  })();

  return (
    <div style={{ minHeight: '100%', paddingBottom: 100 }}>
      <ViewHeader
        palette={p}
        eyebrow={`Year ${year}`}
        title={`${monthNames[month]}`}
        right={
          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            {(year !== TODAY.getFullYear() || month !== TODAY.getMonth()) && (
              <button onClick={() => setCurrentDate(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1))} style={{
                background: 'transparent', border: `1px solid ${p.gold}55`, padding: '4px 10px',
                color: p.gold, fontFamily: 'Inter', fontSize: 10, letterSpacing: 1.5,
                textTransform: 'uppercase', cursor: 'pointer', fontWeight: 600,
              }}>Today</button>
            )}
            <button onClick={() => setCurrentDate(new Date(year, month - 1, 1))} style={navBtn(p)}>‹</button>
            <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} style={navBtn(p)}>›</button>
          </div>
        }
      />

      <div style={{
        padding: '0 24px', marginTop: 14, display: 'flex', gap: 6, overflowX: 'auto',
      }}>
        {[{ value: "__all", label: "All" }, ...categories.map(c => ({ value: c, label: c }))].map(opt => {
          const sel = filterCategory === opt.value;
          return (
            <button key={opt.value} onClick={() => setFilterCategory(opt.value)} style={{
              padding: '6px 12px', whiteSpace: 'nowrap',
              background: sel ? `${p.gold}15` : 'transparent',
              border: `1px solid ${sel ? p.gold : p.gold + '33'}`,
              color: sel ? p.gold : p.pearlDim,
              fontFamily: 'Inter', fontSize: 11, letterSpacing: 1,
              textTransform: 'uppercase', cursor: 'pointer', fontWeight: 500,
            }}>{opt.label}</button>
          );
        })}
      </div>

      <OrnateDivider color={p.gold} style={{ padding: '0 24px', margin: '20px 0 16px' }}/>

      <div style={{ padding: '0 24px', display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4, marginBottom: 8 }}>
        {["M","T","W","T","F","S","S"].map((l, i) => (
          <div key={i} style={{
            fontFamily: 'Inter', fontSize: 10, color: p.goldDim, textAlign: 'center',
            letterSpacing: 1, fontWeight: 600,
          }}>{l}</div>
        ))}
      </div>

      <div style={{ padding: '0 24px', display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4 }}>
        {cells.map((d, i) => {
          if (!d) return <div key={i} style={{ aspectRatio: '1' }}/>;
          const checked = isAnyLogged(d);
          const today = dateKey(d) === dateKey(TODAY);
          const isFuture = d > TODAY;
          return (
            <div
              key={i}
              style={{
                aspectRatio: '1', padding: 0, position: 'relative',
                background: 'transparent',
                opacity: isFuture ? 0.3 : 1,
              }}
            >
              <div style={{
                position: 'absolute', inset: 2,
                border: `1px solid ${checked ? p.gold : p.gold + '33'}`,
                background: checked ? p.gold : 'transparent',
                boxShadow: checked ? `0 0 12px ${p.gold}55, inset 0 0 0 1px ${p.bg}` : 'none',
              }}>
                {checked && (
                  <div style={{
                    position: 'absolute', inset: 2,
                    background: `linear-gradient(135deg, ${p.goldGlow} 0%, ${p.gold} 100%)`,
                  }}>
                    <svg width="100%" height="100%" viewBox="0 0 20 20" style={{ display: 'block' }}>
                      <rect x="6" y="6" width="8" height="8" fill="none" stroke={p.bg} strokeWidth="0.5" opacity="0.5"/>
                      <line x1="10" y1="2" x2="10" y2="18" stroke={p.bg} strokeWidth="0.4" opacity="0.4"/>
                      <line x1="2" y1="10" x2="18" y2="10" stroke={p.bg} strokeWidth="0.4" opacity="0.4"/>
                    </svg>
                  </div>
                )}
              </div>
              {today && (
                <div style={{
                  position: 'absolute', inset: -2, border: `1px solid ${p.accent}`,
                  pointerEvents: 'none',
                }}/>
              )}
              <div style={{
                position: 'absolute', inset: 0, display: 'flex',
                alignItems: 'center', justifyContent: 'center',
                fontFamily: 'JetBrains Mono', fontSize: 11,
                color: checked ? p.bg : (today ? p.accent : p.pearl),
                fontWeight: checked ? 600 : 400,
              }}>
                {d.getDate()}
              </div>
            </div>
          );
        })}
      </div>

      <div style={{
        margin: '24px 24px 0', padding: '16px 18px',
        background: p.bgRaised, position: 'relative',
      }}>
        {[{top:-3,left:-3},{top:-3,right:-3},{bottom:-3,left:-3},{bottom:-3,right:-3}].map((pos,i) => (
          <div key={i} style={{ position:'absolute', width:6, height:6, background:p.gold, ...pos }}/>
        ))}
        <div style={{
          fontFamily: 'Inter', fontSize: 10, letterSpacing: 2, color: p.goldDim,
          textTransform: 'uppercase', marginBottom: 8,
        }}>{groupLabel} · This month</div>
        <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
          <Stat palette={p} label="Kept" value={`${completed}/${totalSoFar}`}/>
          <Stat palette={p} label="Rate" value={`${pct}%`}/>
          <Stat palette={p} label="Longest" value={longestStreak.toString()}/>
        </div>
      </div>

      {caloriesGoal > 0 && habits.some(isCalorieHabit) && (
        <div style={{ marginTop: 16 }}>
          <CalorieIndicator palette={p} label={`${monthNames[month]} calories`}
            net={netCaloriesForDates(habits, cells.filter(d => d && d <= TODAY))}
            goal={caloriesGoal} days={cells.filter(d => d && d <= TODAY && d.getMonth() === month).length}/>
        </div>
      )}
    </div>
  );
}

function Stat({ palette, label, value }) {
  const p = palette;
  return (
    <div>
      <div style={{
        fontFamily: '"Cormorant Garamond", serif', fontSize: 28,
        color: p.gold, fontWeight: 500, lineHeight: 1,
      }}>{value}</div>
      <div style={{
        fontFamily: 'Inter', fontSize: 9, color: p.pearlDim, letterSpacing: 1.5,
        textTransform: 'uppercase', marginTop: 4,
      }}>{label}</div>
    </div>
  );
}

Object.assign(window, { DayView, WeekView, MonthView, ViewHeader, navBtn, Stat });
</script>

<script type="text/babel">
const { useState: useStateD } = React;

function HabitDetail({ palette, checkboxStyle, habit, onBack, toggleLog, onEdit }) {

  return (

        right={
          <button onClick={onEdit} style={{
            background: 'transparent', border: `1px solid ${p.gold}55`, padding: '6px 12px',
            color: p.gold, fontFamily: 'Inter', fontSize: 11, letterSpacing: 1.5,
            textTransform: 'uppercase', cursor: 'pointer',
          }}>Edit</button>
        }
      />

      <div style={{ padding: '14px 24px 0' }}>
        <div style={{ padding: '20px 18px', background: p.bgRaised, position: 'relative' }}>
          {[{top:-3,left:-3},{top:-3,right:-3},{bottom:-3,left:-3},{bottom:-3,right:-3}].map((pos,i) => (
            <div key={i} style={{ position:'absolute', width:6, height:6, background:p.gold, ...pos }}/>
          ))}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div>
              <div style={{ fontFamily: 'Inter', fontSize: 10, letterSpacing: 2, color: p.goldDim, textTransform: 'uppercase' }}>
                Current streak
              </div>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 4 }}>
                <div style={{
                  fontFamily: '"Cormorant Garamond", serif', fontSize: 56,
                  color: habit.frozen ? p.frost : p.gold, fontWeight: 400, lineHeight: 1,
                }}>{habit.streak}</div>
                <div style={{ fontFamily: 'Inter', fontSize: 13, color: p.pearlDim, letterSpacing: 1 }}>days</div>
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, marginTop: 4 }}>
              {habit.frozen
                ? <FrostGlyph size={42} color={p.frost}/>
                : <FlameGlyph size={42} color={p.flame}/>}
              <div style={{ fontFamily: 'Inter', fontSize: 9, letterSpacing: 1.5, color: habit.frozen ? p.frost : p.flame, textTransform: 'uppercase' }}>
                {habit.frozen ? "Frozen" : "Active"}
              </div>
            </div>
          </div>
          <div style={{ height: 1, background: `${p.gold}22`, margin: '16px 0' }}/>
          <div style={{ display: 'flex', justifyContent: 'space-between' }}>
            <Stat palette={p} label="Longest (90d)" value={longestStreak.toString()}/>
            <Stat palette={p} label="Kept (90d)" value={totalLogs.toString()}/>
            <Stat palette={p} label="Rate" value={`${Math.round(totalLogs/90*100)}%`}/>
          </div>
        </div>
      </div>

      <div style={{ padding: '24px 24px 0' }}>
        <div style={{ fontFamily: 'Inter', fontSize: 10, letterSpacing: 2, color: p.goldDim, textTransform: 'uppercase', marginBottom: 10 }}>
          Last 90 days
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(15, 1fr)', gap: 3 }}>
          {days.map((d, i) => {
            const checked = isLogged(habit, d);
            const today = dateKey(d) === dateKey(TODAY);
            return (
              <button
                key={i}
                onClick={() => toggleLog(habit.id, d)}
                title={dateKey(d)}
                style={{
                  aspectRatio: '1', padding: 0, position: 'relative',
                  background: checked ? p.gold : 'transparent',
                  border: `1px solid ${checked ? p.gold : p.gold + '22'}`,
                  cursor: 'pointer',
                  boxShadow: today ? `0 0 0 1px ${p.accent}` : 'none',
                }}
              >
                {checked && (
                  <div style={{
                    position: 'absolute', inset: 1,
                    background: `linear-gradient(135deg, ${p.goldGlow}, ${p.gold})`,
                  }}/>
                )}
              </button>
            );
          })}
        </div>
      </div>

      <OrnateDivider color={p.gold} style={{ padding: '0 24px', margin: '28px 0 18px' }}/>

      <div style={{ padding: '0 24px' }}>
        <div style={{ fontFamily: 'Inter', fontSize: 10, letterSpacing: 2, color: p.goldDim, textTransform: 'uppercase', marginBottom: 12 }}>
          The contract
        </div>
        <DetailRow palette={p} label="Why" value={habit.why}/>
        <DetailRow palette={p} label="When" value={habit.when}/>
        <DetailRow palette={p} label="Where" value={habit.where}/>
        <DetailRow palette={p} label="Trigger" value={habit.trigger}/>
        <DetailRow palette={p} label="Duration" value={habit.duration}/>
        <DetailRow palette={p} label="Started" value="2026.01.15" last/>
      </div>
    </div>
  );
}

function DetailRow({ palette, label, value, last }) {
  const p = palette;
  return (
    <div style={{
      padding: '14px 0', borderBottom: last ? 'none' : `1px solid ${p.gold}1A`,
      display: 'flex', gap: 16,
    }}>
      <div style={{
        width: 80, flexShrink: 0,
        fontFamily: 'Inter', fontSize: 10, letterSpacing: 1.5, color: p.goldDim,
        textTransform: 'uppercase', paddingTop: 2,
      }}>{label}</div>
      <div style={{
        flex: 1, fontFamily: '"Cormorant Garamond", serif', fontSize: 17,
        color: p.pearl, lineHeight: 1.4, fontWeight: 400,
      }}>{value}</div>
    </div>
  );
}

function EditSheet({ palette, habit, onClose, onSave, onDelete, isNew,
                    categories = [], onAddCategory, onRenameCategory, onDeleteCategory }) {
  const [confirmDelete, setConfirmDelete] = useStateD(false);
  const [editingCats, setEditingCats] = useStateD(false);
  const [newCatName, setNewCatName] = useStateD("");
  const [renamingCat, setRenamingCat] = useStateD(null); // name of category being renamed
  const [renameValue, setRenameValue] = useStateD("");
  const p = palette;
  const [name, setName] = useStateD(habit?.name || "");
  const [why, setWhy] = useStateD(habit?.why || "");
  const [whenVal, setWhenVal] = useStateD(habit?.when || "");
  const [whereVal, setWhereVal] = useStateD(habit?.where || "");
  const [triggerVal, setTriggerVal] = useStateD(habit?.trigger || "");
  const [durationVal, setDurationVal] = useStateD(habit?.duration || "");
  const [category, setCategory] = useStateD(habit?.category || categories[0] || "Mindfulness");
  const [frequency, setFrequency] = useStateD(habit?.frequency || "Daily");

  const frequencies = ["Daily", "Weekdays", "3× per week", "Weekly"];

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 100,
      background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'flex-end',
    }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{
        width: '100%', background: p.bg, padding: '20px 24px 40px',
        borderTop: `1px solid ${p.gold}55`, position: 'relative',
        maxHeight: '85%', overflowY: 'auto',
      }}>
        <div style={{
          width: 40, height: 3, background: p.gold, opacity: 0.5,
          margin: '0 auto 16px',
        }}/>

        <div style={{
          fontFamily: 'Inter', fontSize: 10, letterSpacing: 2.5, color: p.goldDim,
          textTransform: 'uppercase', textAlign: 'center', marginBottom: 4,
        }}>{isNew ? "New Habit" : "Edit Habit"}</div>
        <div style={{
          fontFamily: '"Cormorant Garamond", serif', fontSize: 28, color: p.pearl,
          textAlign: 'center', marginBottom: 4, fontWeight: 400,
        }}>The Contract</div>
        <OrnateDivider color={p.gold} style={{ marginBottom: 24 }}/>

        <Field palette={p} label="Name">
          <input value={name} onChange={(e) => setName(e.target.value)}
            placeholder="What will you do?" style={inputStyle(p)}/>
        </Field>

        <div style={{ marginBottom: 16 }}>
          <div style={{
            fontFamily: 'Inter', fontSize: 9, letterSpacing: 2, color: p.goldDim,
            textTransform: 'uppercase', marginBottom: 8, fontWeight: 600,
            display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
          }}>
            <span>Category</span>
            <button onClick={() => setEditingCats(v => !v)} style={{
              background: 'transparent', border: 'none', padding: 0, cursor: 'pointer',
              color: p.gold, fontFamily: 'Inter', fontSize: 9, letterSpacing: 1.5,
              textTransform: 'uppercase', fontWeight: 600,
            }}>{editingCats ? "Done" : "Manage"}</button>
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {categories.map(c => {
              const sel = c === category;
              const chipStyle = {
                padding: '6px 10px', fontFamily: 'Inter', fontSize: 11,
                letterSpacing: 1, textTransform: 'uppercase',
                background: sel ? `${p.gold}15` : 'transparent',
                border: `1px solid ${sel ? p.gold : p.gold + '33'}`,
                color: sel ? p.gold : p.pearlDim,
                display: 'flex', alignItems: 'center', gap: 8,
              };
              if (editingCats) {
                if (renamingCat === c) {
                  return (
                    <form key={c} onSubmit={(e) => {
                      e.preventDefault();
                      const next = renameValue.trim();
                      if (next && next !== c) {
                        onRenameCategory?.(c, next);
                        if (category === c) setCategory(next);
                      }
                      setRenamingCat(null);
                      setRenameValue("");
                    }} style={{ ...chipStyle, padding: '2px 6px' }}>
                      <input
                        autoFocus
                        value={renameValue}
                        onChange={(e) => setRenameValue(e.target.value)}
                        onBlur={() => { setRenamingCat(null); setRenameValue(""); }}
                        style={{
                          background: 'transparent', border: 'none', outline: 'none',
                          color: p.pearl, fontFamily: 'Inter', fontSize: 11,
                          letterSpacing: 1, textTransform: 'uppercase', width: 100, padding: '4px 4px',
                        }}
                      />
                    </form>
                  );
                }
                return (
                  <div key={c} style={chipStyle}>
                    <span onClick={() => { setRenamingCat(c); setRenameValue(c); }}
                      style={{ cursor: 'pointer' }}>{c}</span>
                    <button onClick={() => {
                      if (categories.length <= 1) return;
                      if (category === c) {
                        setCategory(categories.find(x => x !== c) || "");
                      }
                      onDeleteCategory?.(c);
                    }} style={{
                      background: 'transparent', border: 'none', padding: 0, cursor: 'pointer',
                      color: p.flame, fontSize: 14, lineHeight: 1, opacity: categories.length <= 1 ? 0.3 : 1,
                    }} title="Delete category">×</button>
                  </div>
                );
              }
              return (
                <button key={c} onClick={() => setCategory(c)} style={{ ...chipStyle, cursor: 'pointer' }}>
                  {c}
                </button>
              );
            })}
            {editingCats && (
              <form onSubmit={(e) => {
                e.preventDefault();
                const n = newCatName.trim();
                if (n) {
                  onAddCategory?.(n);
                  setCategory(n);
                  setNewCatName("");
                }
              }} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <input
                  value={newCatName}
                  onChange={(e) => setNewCatName(e.target.value)}
                  placeholder="+ New"
                  style={{
                    padding: '6px 10px', fontFamily: 'Inter', fontSize: 11,
                    letterSpacing: 1, textTransform: 'uppercase',
                    background: 'transparent',
                    border: `1px dashed ${p.gold}66`,
                    color: p.pearl, outline: 'none',
                    width: 110,
                  }}
                />
                {newCatName.trim() && (
                  <button type="submit" style={{
                    padding: '6px 10px', fontFamily: 'Inter', fontSize: 11,
                    letterSpacing: 1, textTransform: 'uppercase', cursor: 'pointer',
                    background: p.gold, border: 'none', color: p.bg, fontWeight: 600,
                  }}>Add</button>
                )}
              </form>
            )}
          </div>
        </div>

<script type="text/babel">
const { useState: useStateA, useEffect: useEffectA } = React;

const TWEAK_DEFAULTS = {
  "palette": "midnight",
  "checkboxStyle": "rosette",
  "soundsEnabled": true,
  "caloriesGoal": 2000
};

// ── Audio (synthesized; no files) ───────────────────────────────────────────
let _audioCtx = null;
function getAudioContext() {
  if (!_audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    try { _audioCtx = new Ctx(); } catch { return null; }
  }
  if (_audioCtx.state === 'suspended') _audioCtx.resume().catch(() => {});
  return _audioCtx;
}

// Subtle flint/firelighter click — short filtered noise burst
function playClick() {
  const ctx = getAudioContext();
  if (!ctx) return;
  const now = ctx.currentTime;
  const dur = 0.07;
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const t = i / ctx.sampleRate;
    data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 70);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 1400; hp.Q.value = 0.7;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';  lp.frequency.value = 6000;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.18, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  noise.connect(hp); hp.connect(lp); lp.connect(gain); gain.connect(ctx.destination);
  noise.start(now);
}

// Wine-glass tinge — inharmonic sine partials with long decay
function playGlass() {
  const ctx = getAudioContext();
  if (!ctx) return;
  const now = ctx.currentTime;
  const partials = [
    { freq:  932.33, gain: 0.10, decay: 1.6 },
    { freq: 1864.66, gain: 0.20, decay: 1.4 },
    { freq: 2793.83, gain: 0.13, decay: 1.1 },
    { freq: 4698.64, gain: 0.06, decay: 0.7 },
  ];
  partials.forEach(p => {
    const osc = ctx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = p.freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(p.gain, now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, now + p.decay);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + p.decay + 0.05);
  });
}

  });
  const [currentDate, setCurrentDate] = useStateA(new Date(TODAY));
  const [showWidget, setShowWidget] = useStateA(false);
  const [menuOpen, setMenuOpen] = useStateA(false);

  const [habits, setHabits] = useStateA(() =>
    _persisted ? _persisted.habits : HABITS.map(h => ({ ...h, logs: new Set(h.logs) }))
  );

  const [categories, setCategories] = useStateA(() =>
    _persisted?.categories ?? [
      "Mindfulness", "Learning", "Fitness", "Health", "Creativity", "Productivity", "Social",
    ]
  );

  React.useEffect(() => {
    savePersisted(habits, categories);
  }, [habits, categories]);

  function dismissOnboarding() {
    setShowOnboarding(false);
    try { localStorage.setItem('habit-tracker-onboarded', '1'); } catch {}
  }

  function addCategory(name) {
    const n = name.trim();
    if (!n || categories.includes(n)) return;
    setCategories(prev => [...prev, n]);
  }
  function renameCategory(oldName, newName) {
    const n = newName.trim();
    if (!n || n === oldName || categories.includes(n)) return;
    setCategories(prev => prev.map(c => c === oldName ? n : c));
    setHabits(prev => prev.map(h => h.category === oldName ? { ...h, category: n } : h));
  }
  function deleteCategory(name) {
    if (categories.length <= 1) return;
    const fallback = categories.find(c => c !== name);
    setCategories(prev => prev.filter(c => c !== name));
    setHabits(prev => prev.map(h => h.category === name ? { ...h, category: fallback } : h));
  }

  function toggleLog(habitId, date) {
    navigator.vibrate?.(15);
    setHabits(prev => prev.map(h => {
      if (h.id !== habitId) return h;
      const logs = new Set(h.logs);
      const k = dateKey(date);
      if (logs.has(k)) {
        logs.delete(k);
      } else {
        logs.add(k);
        if (tweaks.soundsEnabled !== false) playClick();
      }
      return { ...h, logs };
    }));
  }

  function setCalorie(habitId, date, raw) {
    setHabits(prev => prev.map(h => {
      if (h.id !== habitId) return h;
      const k = dateKey(date);
      const calories = { ...(h.calories || {}) };
      const trimmed = String(raw ?? '').trim();
      const n = trimmed === '' ? NaN : Number(trimmed);
      if (!Number.isFinite(n) || n <= 0) {
        delete calories[k];
      } else {
        calories[k] = Math.round(n);
      }
      return { ...h, calories };
    }));
  }

  const allKeptToday = habits.length > 0 && habits.every(h => h.logs.has(dateKey(TODAY)));
  const prevAllKeptRef = React.useRef(allKeptToday);
  const [showCelebration, setShowCelebration] = useStateA(false);
  React.useEffect(() => {
    if (allKeptToday && !prevAllKeptRef.current) {
      setShowCelebration(true);
      navigator.vibrate?.([30, 70, 40, 70, 40, 70, 120]);
      if (tweaks.soundsEnabled !== false) playGlass();
    }
    prevAllKeptRef.current = allKeptToday;
  }, [allKeptToday]);

  const habitsWithStreak = habits.map(h => {
    let streak = 0, freeze = 0, frozen = false;
    let cursor = new Date(TODAY);
    for (let i = 0; i < 365; i++) {
      if (h.logs.has(dateKey(cursor))) { streak++; freeze = 0; }
      else { freeze++; if (freeze > 2) break; }
      cursor = addDays(cursor, -1);
    }
    frozen = !h.logs.has(dateKey(TODAY)) && streak > 0;
    return { ...h, streak, frozen };
  });

  if (showOnboarding) {
    return (
      <DeviceShell palette={palette}>
        <Onboarding palette={palette} onDone={dismissOnboarding}/>
      </DeviceShell>
    );
  }

  const currentHabit = route.habitId ? habitsWithStreak.find(h => h.id === route.habitId) : null;

  return (
    <DeviceShell palette={palette}>
      <div style={{
        position: 'relative', width: '100%', minHeight: '100vh', minHeight: '100dvh',
        display: 'flex', flexDirection: 'column',
        paddingTop: 'env(safe-area-inset-top)',
        paddingLeft: 'env(safe-area-inset-left)',
        paddingRight: 'env(safe-area-inset-right)',
      }}>
        <div style={{
          height: 36, padding: '0 18px',
          display: 'flex', alignItems: 'center', justifyContent: 'flex-end',
          flexShrink: 0,
        }}>
          <button onClick={() => setMenuOpen(true)} aria-label="Open menu" style={{
            background: 'transparent', border: `1px solid ${palette.gold}33`,
            padding: '6px 10px', cursor: 'pointer',
            display: 'flex', flexDirection: 'column', gap: 3,
          }}>
            <span style={{ width: 16, height: 1, background: palette.gold }}/>
            <span style={{ width: 16, height: 1, background: palette.gold }}/>
            <span style={{ width: 16, height: 1, background: palette.gold }}/>
          </button>
        </div>
        <div style={{ flex: 1, overflow: 'auto', paddingTop: 0 }}>
          {route.name === "main" && tab === "day" && (
            <DayView palette={palette} checkboxStyle={tweaks.checkboxStyle}
              habits={habitsWithStreak} toggleLog={toggleLog}
              setCalorie={setCalorie}
              caloriesGoal={tweaks.caloriesGoal || 0}
              categories={categories}
              currentDate={currentDate} setCurrentDate={setCurrentDate}
              onOpenHabit={(h) => setRoute({ name: "detail", habitId: h.id })}
              onOpenDate={() => {}}
            />
          )}
          {route.name === "main" && tab === "week" && (
            <WeekView palette={palette} checkboxStyle={tweaks.checkboxStyle}
              habits={habitsWithStreak} toggleLog={toggleLog}
              caloriesGoal={tweaks.caloriesGoal || 0}
              currentDate={currentDate} setCurrentDate={setCurrentDate}
              onOpenHabit={(h) => setRoute({ name: "detail", habitId: h.id })}
            />
          )}
          {route.name === "main" && tab === "month" && (
            <MonthView palette={palette} checkboxStyle={tweaks.checkboxStyle}
              habits={habitsWithStreak} toggleLog={toggleLog}
              caloriesGoal={tweaks.caloriesGoal || 0}
              categories={categories}
              currentDate={currentDate} setCurrentDate={setCurrentDate}
              onOpenHabit={(h) => setRoute({ name: "detail", habitId: h.id })}
            />
          )}
          {route.name === "detail" && currentHabit && (
            <HabitDetail palette={palette} checkboxStyle={tweaks.checkboxStyle}
              habit={currentHabit}
              onBack={() => setRoute({ name: "main" })}
              toggleLog={toggleLog}
              onEdit={() => setRoute({ name: "edit", habitId: currentHabit.id })}
            />
          )}
        </div>

        {route.name === "main" && (
          <TabBar palette={palette} tab={tab} setTab={setTab} onAdd={() => setRoute({ name: "new" })}/>
        )}

        {route.name === "edit" && currentHabit && (
          <EditSheet palette={palette} habit={currentHabit}
            categories={categories}
            onAddCategory={addCategory}
            onRenameCategory={renameCategory}
            onDeleteCategory={deleteCategory}
            onClose={() => setRoute({ name: "detail", habitId: currentHabit.id })}
            onSave={(values) => {
              setHabits(prev => prev.map(h => h.id === currentHabit.id ? {
                ...h,
                name: values.name?.trim() || h.name,
                category: values.category,
                frequency: values.frequency,
                when: values.when ?? h.when,
                where: values.where ?? h.where,
                trigger: values.trigger ?? h.trigger,
                duration: values.duration ?? h.duration,
                why: values.why ?? h.why,
              } : h));
            }}
            onDelete={(id) => {
              setHabits(prev => prev.filter(h => h.id !== id));
              setRoute({ name: "main" });
            }}
            isNew={false}
          />
        )}
        {route.name === "new" && (
          <EditSheet palette={palette} habit={null}
            categories={categories}
            onAddCategory={addCategory}
            onRenameCategory={renameCategory}
            onDeleteCategory={deleteCategory}
            onClose={() => setRoute({ name: "main" })}
            onSave={(values) => {
              if (!values.name?.trim()) return;
              const categoryToGlyph = {
                Mindfulness: 'meditation', Learning: 'reading', Fitness: 'sport',
                Health: 'water', Creativity: 'writing', Productivity: 'creativity', Social: 'social',
              };
              setHabits(prev => [...prev, {
                id: `habit-${Date.now()}`,
                name: values.name.trim(),
                category: values.category,
                glyph: categoryToGlyph[values.category] || 'creativity',
                frequency: values.frequency,
                when: values.when || '',
                where: values.where || '',
                why: values.why || '',
                duration: values.duration || '',
                trigger: values.trigger || '',
                streak: 0,
                frozen: false,
                logs: new Set(),
                calories: {},
              }]);
              setTab("day");
            }}
            isNew={true}
          />
        )}

        {showWidget && (
          <div onClick={() => setShowWidget(false)} style={{
            position: 'absolute', inset: 0, zIndex: 200,
            background: 'radial-gradient(circle at 30% 30%, #2a2a3a 0%, #050505 100%)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            flexDirection: 'column', gap: 24,
          }}>
            <div style={{ fontFamily: 'Inter', fontSize: 11, color: palette.pearlDim, letterSpacing: 2, textTransform: 'uppercase' }}>
              Home Screen
            </div>
            <HabitWidget palette={palette} habits={habitsWithStreak}/>
            <div style={{ fontFamily: 'Inter', fontSize: 11, color: palette.pearlDim }}>Tap to dismiss</div>
          </div>
        )}

        {showCelebration && (
          <Celebration palette={palette} onDone={() => setShowCelebration(false)}/>
        )}

        {menuOpen && (
          <MenuSheet palette={palette} tweaks={tweaks} setTweak={setTweak}
            onClose={() => setMenuOpen(false)}/>
        )}
      </div>

    </DeviceShell>
  );
}

function MenuSheet({ palette, tweaks, setTweak, onClose }) {
  const p = palette;
  const paletteOpts = [
    { value: "midnight", label: "Midnight" },
    { value: "forest",   label: "Forest" },
    { value: "burgundy", label: "Burgundy" },
    { value: "amethyst", label: "Amethyst" },
  ];
  const styleOpts = [
    { value: "rosette",  label: "Rosette" },
    { value: "stained",  label: "Stained" },
    { value: "engraved", label: "Engraved" },
    { value: "candle",   label: "Candle" },
  ];
  const chip = (sel) => ({
    padding: '8px 12px', fontFamily: 'Inter', fontSize: 11,
    letterSpacing: 1, textTransform: 'uppercase', cursor: 'pointer',
    background: sel ? `${p.gold}15` : 'transparent',
    border: `1px solid ${sel ? p.gold : p.gold + '33'}`,
    color: sel ? p.gold : p.pearlDim, fontWeight: 500,
    flex: 1, textAlign: 'center',
  });
  return (
    <div onClick={onClose} style={{
      position: 'absolute', inset: 0, zIndex: 100,
      background: 'rgba(0,0,0,0.7)',
      paddingTop: 'env(safe-area-inset-top)',
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: p.bg, padding: '20px 24px 28px',
        borderBottom: `1px solid ${p.gold}55`, position: 'relative',
      }}>
        <div style={{
          fontFamily: 'Inter', fontSize: 10, letterSpacing: 2.5, color: p.goldDim,
          textTransform: 'uppercase', textAlign: 'center', marginBottom: 4,
        }}>Menu</div>
        <div style={{
          fontFamily: '"Cormorant Garamond", serif', fontSize: 28, color: p.pearl,
          textAlign: 'center', marginBottom: 4, fontWeight: 400,
        }}>Settings</div>
        <OrnateDivider color={p.gold} style={{ marginBottom: 22 }}/>

        <div style={{
          fontFamily: 'Inter', fontSize: 9, letterSpacing: 2, color: p.goldDim,
          textTransform: 'uppercase', marginBottom: 8, fontWeight: 600,
        }}>Palette</div>
        <div style={{ display: 'flex', gap: 6, marginBottom: 18 }}>
          {paletteOpts.map(o => (
            <button key={o.value} onClick={() => setTweak('palette', o.value)} style={chip(tweaks.palette === o.value)}>
              {o.label}
            </button>
          ))}
        </div>

        <div style={{
          fontFamily: 'Inter', fontSize: 9, letterSpacing: 2, color: p.goldDim,
          textTransform: 'uppercase', marginBottom: 8, fontWeight: 600,
        }}>Checkbox style</div>
        <div style={{ display: 'flex', gap: 6, marginBottom: 18 }}>
          {styleOpts.map(o => (
            <button key={o.value} onClick={() => setTweak('checkboxStyle', o.value)} style={chip(tweaks.checkboxStyle === o.value)}>
              {o.label}
            </button>
          ))}
        </div>

        <div style={{
          fontFamily: 'Inter', fontSize: 9, letterSpacing: 2, color: p.goldDim,
          textTransform: 'uppercase', marginBottom: 8, fontWeight: 600,
          display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
        }}>
          <span>Daily calorie goal</span>
          <span style={{
            fontFamily: 'JetBrains Mono', fontSize: 9, color: p.pearlDim,
            letterSpacing: 0.5, textTransform: 'none',
          }}>kcal</span>
        </div>
        <input
          type="number" inputMode="numeric" min="0" step="50"
          value={tweaks.caloriesGoal ?? 0}
          onChange={(e) => {
            const n = parseInt(e.target.value, 10);
            setTweak('caloriesGoal', Number.isFinite(n) && n >= 0 ? n : 0);
          }}
          style={{
            width: '100%', padding: '10px 12px', boxSizing: 'border-box',
            background: p.bgRaised, border: `1px solid ${p.gold}33`,
            color: p.pearl, fontFamily: 'JetBrains Mono, monospace',
            fontSize: 16, outline: 'none', marginBottom: 18, textAlign: 'right',
          }}
        />

        <div style={{
          fontFamily: 'Inter', fontSize: 9, letterSpacing: 2, color: p.goldDim,
          textTransform: 'uppercase', marginBottom: 8, fontWeight: 600,
        }}>Sounds</div>
        <div style={{ display: 'flex', gap: 6, marginBottom: 22 }}>
          <button onClick={() => {
            setTweak('soundsEnabled', true);
            // Prime the AudioContext inside this user gesture so the
            // 100% chime can play later from a non-tap effect.
            getAudioContext();
          }} style={chip(tweaks.soundsEnabled !== false)}>On</button>
          <button onClick={() => setTweak('soundsEnabled', false)}
            style={chip(tweaks.soundsEnabled === false)}>Off</button>
        </div>

        <button onClick={onClose} style={{
          width: '100%', padding: '14px 16px', background: p.gold,
          border: `1px solid ${p.gold}`, color: p.bg,
          fontFamily: 'Inter', fontSize: 12, letterSpacing: 2,
          textTransform: 'uppercase', cursor: 'pointer', fontWeight: 600,
        }}>Done</button>
      </div>
    </div>
  );
}

function TabBar({ palette, tab, setTab, onAdd }) {
  const p = palette;
  const tabs = [
    { id: "day", label: "Day" },
    { id: "week", label: "Week" },
    { id: "month", label: "Month" },
  ];
  return (
    <div style={{
      position: 'relative', padding: '14px 24px',
      paddingBottom: 'calc(20px + env(safe-area-inset-bottom))',
      background: `linear-gradient(to top, ${p.bg} 60%, ${p.bg}00)`,
    }}>
      <div style={{
        position: 'absolute', top: 14, left: 24, right: 24,
        height: 1, background: `linear-gradient(to right, transparent, ${p.gold}55, transparent)`,
      }}/>

      <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginTop: 8 }}>
        {tabs.map(t => {
          const sel = t.id === tab;
          return (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              flex: 1, padding: '10px 4px', position: 'relative',
              background: 'transparent', border: 'none', cursor: 'pointer',
            }}>
              <div style={{
                fontFamily: '"Cormorant Garamond", serif', fontSize: 18,
                color: sel ? p.gold : p.pearlDim, fontWeight: 400, letterSpacing: 0.3,
              }}>{t.label}</div>
              {sel && (
                <div style={{
                  position: 'absolute', bottom: 4, left: '50%',
                  transform: 'translateX(-50%)',
                  display: 'flex', gap: 3, alignItems: 'center',
                }}>
                  <div style={{ width: 3, height: 3, background: p.gold }}/>
                  <div style={{ width: 12, height: 1, background: p.gold }}/>
                  <div style={{ width: 3, height: 3, background: p.gold }}/>
                </div>
              )}
            </button>
          );
        })}
        <button onClick={onAdd} style={{
          width: 44, height: 44, marginLeft: 8, padding: 0,
          background: p.gold, border: 'none', cursor: 'pointer',
          color: p.bg, fontFamily: 'serif', fontSize: 24, fontWeight: 300,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          position: 'relative',
        }}>
          {[{top:-2,left:-2},{top:-2,right:-2},{bottom:-2,left:-2},{bottom:-2,right:-2}].map((pos,i) => (
            <div key={i} style={{ position:'absolute', width:4, height:4, background:p.gold, ...pos }}/>
          ))}
          <span style={{ lineHeight: 1, marginTop: -2 }}>+</span>
        </button>
      </div>
    </div>
  );
}

function DeviceShell({ palette, children }) {
  const p = palette;
  return (
    <div style={{
      width: '100%', minHeight: '100vh', minHeight: '100dvh',
      position: 'relative', background: p.bg,
      fontFamily: 'Inter, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
      color: p.pearl,
      overflow: 'hidden',
    }}>
      <div style={{
        position: 'absolute', inset: 0, pointerEvents: 'none',
        background: `
          radial-gradient(ellipse at top, ${p.gold}08 0%, transparent 50%),
          radial-gradient(ellipse at bottom, ${p.accent}05 0%, transparent 50%)
        `,
        zIndex: 1,
      }}/>

      <div style={{ position: 'relative', minHeight: '100vh', minHeight: '100dvh', zIndex: 2 }}>
        {children}
      </div>
    </div>
  );
}

function HabitTweaks({ tweaks, setTweak }) {
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection title="Palette">
        <TweakRadio
          options={[
            { value: "midnight", label: "Midnight" },
            { value: "forest", label: "Forest" },
            { value: "burgundy", label: "Burgundy" },
            { value: "amethyst", label: "Amethyst" },
          ]}
          value={tweaks.palette}
          onChange={(v) => setTweak('palette', v)}
        />
      </TweakSection>
      <TweakSection title="Checkbox style">
        <TweakRadio
          options={[
            { value: "rosette", label: "Rosette" },
            { value: "stained", label: "Stained" },
            { value: "engraved", label: "Engraved" },
            { value: "candle", label: "Candle" },
          ]}
          value={tweaks.checkboxStyle}
          onChange={(v) => setTweak('checkboxStyle', v)}
        />
      </TweakSection>
    </TweaksPanel>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return <HabitApp tweaks={tweaks} setTweak={setTweak}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
